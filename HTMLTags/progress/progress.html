<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Tag Demo</title>
  </head>
  <body>
    <h1>HTML Progress Tag Example</h1>
    <p>
      This example demonstrates the use of the HTML
      <code>&lt;progress&gt;</code> tag.
    </p>
    <a
      href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/progress"
      target="_blank"
      >Learn more about the progress tag</a
    >

    <hr />

    <div>
      <progress value="70" max="100">70%</progress>
      <p>Progress: 70%</p>
    </div>
  </body>
</html>
